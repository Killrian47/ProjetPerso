services:
  postgres:
    image: postgres:16-alpine
    container_name: mangadb-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mangadb
    volumes:
      - mangadb-data:/var/lib/postgresql/data

volumes:
  mangadb-data:
